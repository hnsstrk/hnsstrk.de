<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Split-Flap-Kachel: obere und untere Flap-Hälfte mit Spalt -->
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="32" fill="#232834"/>
    <rect y="32" width="64" height="32" fill="#1a1f2b"/>
    <rect y="30.75" width="64" height="2.5" fill="#0a0d12"/>
  </g>
  <!-- Prompt-Chevron, wie im Logo -->
  <path d="M 23.5 19 L 40.5 32 L 23.5 45" fill="none" stroke="#f29718" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
